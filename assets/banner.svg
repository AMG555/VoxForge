<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#EA580C" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="vfShieldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <linearGradient id="vfGlyphB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <filter id="bannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#centerGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.2">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />

    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Centered Option 1 Heraldic Emblem (180x180 scale) -->
  <g transform="translate(550, 60)" filter="url(#bannerShadow)">
    <rect width="180" height="180" rx="40" fill="#0B0E14" />
    <circle cx="90" cy="90" r="75" fill="none" stroke="#1E293B" stroke-width="2" />

    <!-- Shield scaled to 180 (scale = 180/256 = 0.703) -->
    <g transform="scale(0.703125)">
      <path d="M128 36 L196 66 C196 132 170 186 128 216 C86 186 60 132 60 66 Z" fill="url(#vfShieldB)" />
      
      <!-- Waves -->
      <line x1="104" y1="82" x2="104" y2="128" stroke="url(#vfGlyphB)" stroke-width="12" stroke-linecap="round"/>
      <line x1="128" y1="62" x2="128" y2="128" stroke="url(#vfGlyphB)" stroke-width="12" stroke-linecap="round"/>
      <line x1="152" y1="82" x2="152" y2="128" stroke="url(#vfGlyphB)" stroke-width="12" stroke-linecap="round"/>

      <path d="M84 92 C80 102 80 114 84 124" fill="none" stroke="url(#vfGlyphB)" stroke-width="7" stroke-linecap="round"/>
      <path d="M172 92 C176 102 176 114 172 124" fill="none" stroke="url(#vfGlyphB)" stroke-width="7" stroke-linecap="round"/>

      <!-- Anvil -->
      <path d="M72 142 L184 142" stroke="url(#vfGlyphB)" stroke-width="12" stroke-linecap="round"/>
      <path d="M102 148 C106 160 100 172 90 174 L166 174 C156 172 150 160 154 148" fill="url(#vfGlyphB)" />
      <line x1="86" y1="176" x2="170" y2="176" stroke="url(#vfGlyphB)" stroke-width="10" stroke-linecap="round"/>

      <circle cx="128" cy="160" r="4.5" fill="#EA580C"/>
      <circle cx="128" cy="46" r="4.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="640" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" letter-spacing="4" fill="#FFFFFF">
    VOX<tspan fill="#F59E0B">FORGE</tspan>
  </text>

  <text x="640" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" letter-spacing="2" fill="#94A3B8">
    ZERO-SHOT VOICE CLONING &amp; NEURAL SPEECH WORKSTATION
  </text>

  <text x="640" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#64748B">
    Pure Rust Binary • 646+ Languages • Broadcast DSP Mastering • Model Context Protocol (MCP) • Embedded React 19 UI
  </text>

  <!-- Feature Badges -->
  <g transform="translate(640, 465)">
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="80" y="23" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#FDE68A">⚡ 646+ Languages</text>
    </g>
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="80" y="23" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#38BDF8">🦀 Rust High-Perf</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1E293B" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="80" y="23" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#34D399">🔒 100% Private</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="90" y="23" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#C4B5FD">🤖 14-Tool MCP Server</text>
    </g>
  </g>
</svg>
