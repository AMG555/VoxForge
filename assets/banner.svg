<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0E14" />
      <stop offset="50%" stopColor="#111827" />
      <stop offset="100%" stopColor="#070A0F" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#F59E0B" stop-opacity="0.12" />
      <stop offset="40%" stopColor="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stopColor="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="vfForgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>

    <linearGradient id="vfWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#34D399" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#centerGlow)" />

  <!-- Grid overlay -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />

    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Centered Logo Mark (Shield + Waves + Anvil) -->
  <g transform="translate(540, 70)">
    <!-- Backing Shield -->
    <rect x="8" y="8" width="184" height="184" rx="38" fill="url(#shieldGrad)" stroke="#334155" stroke-width="3" />

    <g filter="url(#logoGlow)">
      <!-- Ambient sound concentric circles -->
      <circle cx="100" cy="100" r="70" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 6" />
      <circle cx="100" cy="100" r="54" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25" />

      <!-- Harmonic Frequency Bars -->
      <rect x="36" y="88" width="6" height="24" rx="3" fill="url(#vfWaveGrad)" />
      <rect x="48" y="78" width="6" height="44" rx="3" fill="url(#vfWaveGrad)" />
      <rect x="60" y="66" width="6" height="68" rx="3" fill="url(#vfWaveGrad)" />
      <rect x="72" y="54" width="6" height="92" rx="3" fill="url(#vfWaveGrad)" />

      <rect x="122" y="54" width="6" height="92" rx="3" fill="url(#vfWaveGrad)" />
      <rect x="134" y="66" width="6" height="68" rx="3" fill="url(#vfWaveGrad)" />
      <rect x="146" y="78" width="6" height="44" rx="3" fill="url(#vfWaveGrad)" />
      <rect x="158" y="88" width="6" height="24" rx="3" fill="url(#vfWaveGrad)" />
    </g>

    <!-- Forge Anvil & Horn Silhouette -->
    <g filter="url(#logoGlow)">
      <path d="M 68 84 L 132 84 C 142 84 150 88 152 92 C 150 96 140 98 132 98 L 118 98 L 114 122 L 126 130 L 74 130 L 86 122 L 82 98 L 68 98 C 58 98 52 94 52 91 C 52 87 60 84 68 84 Z" fill="url(#vfForgeGrad)" stroke="#FDE68A" stroke-width="2" stroke-linejoin="round" />
      <path d="M 66 130 L 134 130 L 140 144 L 60 144 Z" fill="#D97706" stroke="#F59E0B" stroke-width="1.5" />
      <polygon points="100,68 106,86 98,92 104,104 94,108 97,94 92,90" fill="#FEF08A" />
    </g>
  </g>

  <!-- Typography -->
  <text x="640" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="#FFFFFF">
    VOX<tspan fill="#F59E0B">FORGE</tspan>
  </text>

  <text x="640" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" letter-spacing="2" fill="#94A3B8">
    ZERO-SHOT VOICE CLONING &amp; NEURAL SPEECH WORKSTATION
  </text>

  <text x="640" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#64748B">
    Pure Rust Binary • 646+ Languages • Broadcast DSP Mastering • Model Context Protocol (MCP) • Embedded React 19 UI
  </text>

  <!-- Feature Pills -->
  <g transform="translate(640, 480)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="160" height="38" rx="19" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="80" y="24" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#FDE68A">⚡ 646+ Languages</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="160" height="38" rx="19" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="80" y="24" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#38BDF8">🦀 Rust High-Perf</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="38" rx="19" fill="#1E293B" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="80" y="24" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#34D399">🔒 100% Private</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="90" y="24" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#C4B5FD">🤖 14-Tool MCP Server</text>
    </g>
  </g>
</svg>
