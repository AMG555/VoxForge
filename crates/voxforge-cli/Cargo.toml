[package]
name = "voxforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "voxforge"
path = "src/main.rs"

[dependencies]
voxforge-core = { workspace = true }
voxforge-hardware = { workspace = true }
voxforge-audio = { workspace = true }
voxforge-engine = { workspace = true }
voxforge-pipeline = { workspace = true }
voxforge-asr = { workspace = true }
voxforge-catalog = { workspace = true }
voxforge-mcp = { workspace = true }
voxforge-api = { workspace = true }
axum.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
hex.workspace = true
serde_json.workspace = true

[build-dependencies]
winres = "0.1"
