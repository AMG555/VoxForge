name: Release Packages & Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: voxforge-windows-x86_64.exe
            zip_name: VoxForge-Windows-x64.zip
          - os: ubuntu-latest
            artifact_name: voxforge-linux-x86_64
            zip_name: voxforge-linux-x86_64.tar.gz
          - os: macos-latest
            artifact_name: voxforge-macos-universal
            zip_name: voxforge-macos-universal.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Web UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Sync UI to Embedded API Crate
        shell: bash
        run: |
          rm -rf crates/voxforge-api/ui_dist/*
          mkdir -p crates/voxforge-api/ui_dist
          cp -r ui/dist/* crates/voxforge-api/ui_dist/

      - name: Install Linux Tauri WebKit Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal Targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Standalone Rust Binary & Desktop App (Windows & Linux)
        if: runner.os != 'macOS'
        run: cargo build --profile release-small --bin voxforge --bin voxforge-desktop

      - name: Build Standalone Rust Binary & Desktop App (macOS Universal via lipo)
        if: runner.os == 'macOS'
        run: |
          cargo build --profile release-small --bin voxforge --bin voxforge-desktop --target aarch64-apple-darwin
          cargo build --profile release-small --bin voxforge --bin voxforge-desktop --target x86_64-apple-darwin

      - name: Package Windows Release (.exe and .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist -Force
          Copy-Item target/release-small/voxforge.exe -Destination dist/voxforge-windows-x86_64.exe -Force
          Copy-Item target/release-small/voxforge.exe -Destination dist/voxforge.exe -Force
          Copy-Item target/release-small/voxforge-desktop.exe -Destination dist/voxforge-desktop.exe -Force
          Copy-Item target/release-small/voxforge-desktop.exe -Destination dist/voxforge-desktop-windows-x86_64.exe -Force
          Copy-Item assets/voxforge.ico -Destination dist/voxforge.ico -Force
          mkdir dist/scripts -Force
          Copy-Item scripts/neural_sidecar.py -Destination dist/scripts/neural_sidecar.py -Force

          # Create batch launcher
          Set-Content -Path dist/VoxForge-Start.bat -Value "@echo off`r`nstart `"`" `"%~dp0voxforge-desktop.exe`"" -Force

          # Create installer script with offline check and online fallback
          Set-Content -Path dist/install-desktop.bat -Value "@echo off`r`nif exist `"%~dp0..\scripts\install.ps1`" (`r`n    powershell -NoProfile -ExecutionPolicy Bypass -File `"%~dp0..\scripts\install.ps1`"`r`n) else (`r`n    powershell -NoProfile -ExecutionPolicy Bypass -Command `"& { irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex }`"`r`n)`r`npause" -Force

          Compress-Archive -Path dist/voxforge.exe, dist/voxforge-desktop.exe, dist/voxforge.ico, dist/VoxForge-Start.bat, dist/install-desktop.bat, dist/scripts -DestinationPath dist/VoxForge-Windows-x64.zip -Force

      - name: Build Inno Setup Installer (VoxForge_Setup_x64.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc scripts/installer/voxforge.iss
          if (-not (Test-Path "dist/VoxForge_Setup_x64.exe")) {
            throw "Expected dist/VoxForge_Setup_x64.exe was not generated by Inno Setup."
          }
          Write-Host "Installer built successfully: dist/VoxForge_Setup_x64.exe"

      - name: Sign Windows Binaries (if certificate configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            Write-Host "Signing Windows binaries with Authenticode certificate..."
            $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
            $pfxPath = "$env:TEMP\cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $certBytes)
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
            if ($signtool) {
              Get-ChildItem "dist\*.exe" | ForEach-Object {
                Write-Host "Signing $($_.FullName)..."
                & $signtool sign /f $pfxPath /p "$env:WINDOWS_CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
              }
            } else {
              Write-Warning "signtool.exe not found on runner."
            }
            Remove-Item $pfxPath -Force
          } else {
            Write-Host "No WINDOWS_CERT_BASE64 secret found; skipping Authenticode signing."
          }

      - name: Package macOS Universal Release (.tar.gz and Standalone)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          lipo -create -output dist/voxforge-macos-universal \
            target/aarch64-apple-darwin/release-small/voxforge \
            target/x86_64-apple-darwin/release-small/voxforge
          lipo -create -output dist/voxforge-desktop-macos-universal \
            target/aarch64-apple-darwin/release-small/voxforge-desktop \
            target/x86_64-apple-darwin/release-small/voxforge-desktop
          # Provide arch-specific copies so install.sh and npm runner succeed on any architecture
          cp dist/voxforge-macos-universal dist/voxforge-macos-aarch64
          cp dist/voxforge-macos-universal dist/voxforge-macos-x86_64
          cp dist/voxforge-macos-universal dist/voxforge-macos-arm64
          chmod +x dist/voxforge-macos* dist/voxforge-desktop-macos-universal
          mkdir -p dist/scripts
          cp scripts/neural_sidecar.py dist/scripts/neural_sidecar.py
          tar -czvf dist/voxforge-macos-universal.tar.gz -C dist voxforge-macos-universal voxforge-desktop-macos-universal scripts/neural_sidecar.py

      - name: Package Linux Release (.tar.gz and Standalone)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release-small/voxforge dist/voxforge-linux-x86_64
          cp target/release-small/voxforge-desktop dist/voxforge-desktop-linux-x86_64
          chmod +x dist/voxforge-linux-x86_64 dist/voxforge-desktop-linux-x86_64
          mkdir -p dist/scripts
          cp scripts/neural_sidecar.py dist/scripts/neural_sidecar.py
          tar -czvf dist/voxforge-linux-x86_64.tar.gz -C dist voxforge-linux-x86_64 voxforge-desktop-linux-x86_64 scripts/neural_sidecar.py

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-checksums:
    name: Publish Unified SHA-256 Checksums
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Release Assets & Compute Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir release-assets --pattern '*' --skip-existing
          rm -f release-assets/checksums.txt
          (cd release-assets && sha256sum $(LC_ALL=C ls -1) > ../checksums.txt)
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --repo "${{ github.repository }}" --clobber
