[workspace]
resolver = "2"
members = [
    "crates/voxforge-core",
    "crates/voxforge-hardware",
    "crates/voxforge-audio",
    "crates/voxforge-engine",
    "crates/voxforge-router",
    "crates/voxforge-pronunciation",
    "crates/voxforge-pipeline",
    "crates/voxforge-benchmark",
    "crates/voxforge-worker",
    "crates/voxforge-asr",
    "crates/voxforge-catalog",
    "crates/voxforge-mcp",
    "crates/voxforge-api",
    "crates/voxforge-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["VoxForge Core Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/voxforge/voxforge"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
hound = "3.5"
sysinfo = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
http-body-util = "0.1"
subtle = "2.5"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
hex = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

# Internal workspace crates
voxforge-core          = { path = "crates/voxforge-core" }
voxforge-hardware      = { path = "crates/voxforge-hardware" }
voxforge-audio         = { path = "crates/voxforge-audio" }
voxforge-engine        = { path = "crates/voxforge-engine" }
voxforge-router        = { path = "crates/voxforge-router" }
voxforge-pronunciation = { path = "crates/voxforge-pronunciation" }
voxforge-pipeline      = { path = "crates/voxforge-pipeline" }
voxforge-benchmark     = { path = "crates/voxforge-benchmark" }
voxforge-worker        = { path = "crates/voxforge-worker" }
voxforge-asr           = { path = "crates/voxforge-asr" }
voxforge-catalog       = { path = "crates/voxforge-catalog" }
voxforge-mcp           = { path = "crates/voxforge-mcp" }
voxforge-api           = { path = "crates/voxforge-api" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
