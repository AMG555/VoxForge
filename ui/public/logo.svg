<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="vfShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="vfGlyph" x1="128" y1="56" x2="128" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="vfDrop" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Tile (Squircle rx=56) -->
  <rect width="256" height="256" rx="56" fill="#0b0e14"/>
  <circle cx="128" cy="128" r="106" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Molten Forge Shield -->
  <g filter="url(#vfDrop)">
    <path d="M128 36 L196 66 C196 132 170 186 128 216 C86 186 60 132 60 66 Z" 
          fill="url(#vfShield)" />
  </g>

  <!-- 3 Harmonic Acoustic Wave Bars ("VOX") - 2D geometry with rx=6 -->
  <rect x="98" y="76" width="12" height="58" rx="6" fill="url(#vfGlyph)" />
  <rect x="122" y="56" width="12" height="78" rx="6" fill="url(#vfGlyph)" />
  <rect x="146" y="76" width="12" height="58" rx="6" fill="url(#vfGlyph)" />

  <!-- Radiating Sonic Arcs -->
  <path d="M84 92 C80 102 80 114 84 124" fill="none" stroke="url(#vfGlyph)" stroke-width="7" stroke-linecap="round"/>
  <path d="M172 92 C176 102 176 114 172 124" fill="none" stroke="url(#vfGlyph)" stroke-width="7" stroke-linecap="round"/>

  <!-- Sleek Forged Anvil ("FORGE") -->
  <rect x="66" y="136" width="124" height="12" rx="6" fill="url(#vfGlyph)" />
  <path d="M102 148 C106 160 100 172 90 174 L166 174 C156 172 150 160 154 148 Z" 
        fill="url(#vfGlyph)" />
  <rect x="81" y="171" width="94" height="10" rx="5" fill="url(#vfGlyph)" />

  <!-- Center Ember Core Point -->
  <circle cx="128" cy="160" r="4.5" fill="#ea580c"/>

  <!-- Neural Creation Spark -->
  <circle cx="128" cy="46" r="4.5" fill="#ffffff"/>
</svg>
